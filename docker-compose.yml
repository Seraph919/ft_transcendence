services:

  # ============================================================
  # GATEWAY & FRONTEND
  # ============================================================

  nginx:
    mem_limit: 256m
    container_name: nginx
    build:
      context: .
      dockerfile: gateway-frontend/gateway/Dockerfile
    environment:
      - DOMAIN=${DOMAIN:-localhost}
      - PARANOIA=1
      - BLOCKING_PARANOIA=1
      - MODSEC_RULE_ENGINE=on
      - ALLOWED_METHODS=GET HEAD POST OPTIONS PUT PATCH DELETE
    ports:
      - "8080:8080"
      - "8443:8443"
      # - "80:8080"
      # - "443:8443"
    volumes:
      - ./certs:/certs:ro
      - nginx_tls:/etc/nginx/conf
    networks:
      - private
    depends_on:
      frontend:
        condition: service_healthy
      identity-service:
        condition: service_healthy
      chat-service:
        condition: service_healthy
      org-service:
        condition: service_healthy
      grafana:
        condition: service_started
      prometheus:
        condition: service_started
      docker-exporter:
        condition: service_healthy
      status-page:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 5s
      retries: 5
    restart: always

  frontend:
    mem_limit: 64m
    build:
      context: ./gateway-frontend/frontend
      dockerfile: Dockerfile
    container_name: frontend
    networks:
      - private
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost/ || exit 1"]
      interval: 20s
      timeout: 3s
      retries: 3
    restart: always


  # ============================================================
  # APPLICATION / MICROSERVICES
  # ============================================================

  org-service:
    mem_limit: 1g
    build: application/org-service/.
    container_name: org-service
    environment:
      SPRING_DATASOURCE_URL: ${ORG_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${ORG_POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${ORG_POSTGRES_PASSWORD}
      PORT: 8082
    networks:
      - private
    expose:
      - "8082"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/healthz"]
      interval: 20s
      timeout: 3s
      retries: 5
      start_period: 10s
    depends_on:
      org-service_postgres:
        condition: service_healthy
    restart: always

  chat-service:
    mem_limit: 1g
    build:
      context: ./application/
      dockerfile: ./chat-service/Dockerfile
    container_name: chat-service
    environment:
      PORT: 8081
      CHAT_MONGO_DB: ${CHAT_MONGO_DB}
      CHAT_MONGO_USER: ${CHAT_MONGO_USER}
      CHAT_MONGO_PASSWORD: ${CHAT_MONGO_PASSWORD}
      CHAT_MONGO_AUTH_DB: ${CHAT_MONGO_AUTH_DB}
      IDENTITY_GRPC_PORT: ${IDENTITY_GRPC_PORT}
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8081/actuator/health || exit 1"]
      interval: 20s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - private
    depends_on:
      mongodb:
        condition: service_healthy
    expose:
      - "8081"
      - "9090" # gRPC: org-service pushes room changes here (ChatNotifyService)
    restart: always

  identity-migrate:
    build:
      context: application/identity-service/.
      target: migration
    environment:
      DATABASE_URL: ${DATABASE_URL}
    networks:
      - private
    depends_on:
      identity-service_postgres:
        condition: service_healthy
    restart: "no"

  identity-service:
    mem_limit: 512m
    build: application/identity-service/.
    container_name: identity-service
    networks:
      - private
    expose:
      - "8083"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER}
      IDENTITY_HTTP_PORT: ${IDENTITY_HTTP_PORT}
      AVATAR_DIR: ${AVATAR_DIR}
    volumes:
      - identity_avatars:/tmp/identity-avatars
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:$${IDENTITY_HTTP_PORT:-8083}/health || exit 1"]
      interval: 20s
      timeout: 3s
      retries: 3
      start_period: 10s
    depends_on:
      identity-migrate:
        condition: service_completed_successfully
      identity-service_postgres:
        condition: service_healthy
    restart: always


  # ============================================================
  # DATABASES
  # ============================================================

  identity-service_postgres:
    mem_limit: 512m
    image: postgres:16-alpine
    container_name: identity-service_postgres
    environment:
      POSTGRES_USER: ${IDENTITY_POSTGRES_USER}
      POSTGRES_PASSWORD: ${IDENTITY_POSTGRES_PASSWORD}
      POSTGRES_DB: ${IDENTITY_POSTGRES_DB}
    volumes:
      - database:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: always
    networks:
      - private

  org-service_postgres:
    mem_limit: 512m
    image: postgres:16-alpine
    container_name: org-service_postgres
    environment:
      POSTGRES_USER: ${ORG_POSTGRES_USER}
      POSTGRES_PASSWORD: ${ORG_POSTGRES_PASSWORD}
      POSTGRES_DB: ${ORG_POSTGRES_DB}
    volumes:
      - org-service_postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: always
    networks:
      - private

  mongodb:
    mem_limit: 1g
    image: mongo:7
    container_name: mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    volumes:
      - mongo_data:/data/db
    expose:
      - "27017"
    networks:
      - private
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: always


  # ============================================================
  # MONITORING & OBSERVABILITY
  # ============================================================

  prometheus:
    mem_limit: 512m
    container_name: prometheus
    image: prom/prometheus
    expose:
      - "9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.external-url=http://localhost/prometheus/'
      - '--web.route-prefix=/'
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./monitoring/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml
      - prometheus_data:/prometheus
    networks:
      - private
    restart: always

  alertmanager:
    mem_limit: 128m
    container_name: alertmanager
    image: prom/alertmanager:latest
    environment:
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
    volumes:
      - ./monitoring/prometheus/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./monitoring/prometheus/start-alertmanager.sh:/etc/alertmanager/start.sh:ro
    entrypoint: ["/bin/sh", "/etc/alertmanager/start.sh"]
    command: ["--storage.path=/alertmanager"]
    expose:
      - "9093"
    networks:
      - private
    restart: always

  grafana:
    mem_limit: 1g
    image: grafana/grafana:13.0.3-slim
    container_name: grafana
    expose:
      - "3000"
    networks:
      - private
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/:/etc/grafana/provisioning:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 15
    environment:
      GF_SERVER_ROOT_URL: ${GF_SERVER_ROOT_URL}
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
      GF_SECURITY_COOKIE_SECURE: ${GF_SECURITY_COOKIE_SECURE}
      GF_USERS_ALLOW_SIGN_UP: ${GF_USERS_ALLOW_SIGN_UP}
      GF_PLUGINS_CHECK_FOR_UPDATES: ${GF_PLUGINS_CHECK_FOR_UPDATES}
      GF_AUTH_ANONYMOUS_ENABLED: ${GF_AUTH_ANONYMOUS_ENABLED}
      GF_AUTH_ANONYMOUS_ORG_NAME: ${GF_AUTH_ANONYMOUS_ORG_NAME}
      GF_AUTH_ANONYMOUS_ORG_ROLE: ${GF_AUTH_ANONYMOUS_ORG_ROLE}
      GF_AUTH_DISABLE_LOGIN_FORM: ${GF_AUTH_DISABLE_LOGIN_FORM}
      GF_SECURITY_ALLOW_EMBEDDING: ${GF_SECURITY_ALLOW_EMBEDDING}
    restart: always

  status-page:
    mem_limit: 128m
    image: twinproduction/gatus:latest
    container_name: status-page
    volumes:
      - ./monitoring/status-page/config.yaml:/config/config.yaml:ro
    expose:
      - "8080"
    networks:
      - private
    restart: always


  # ============================================================
  # METRICS EXPORTERS
  # ============================================================

  nginx-exporter:
    mem_limit: 64m
    image: nginx/nginx-prometheus-exporter:1.1.0
    container_name: nginx-exporter
    command:
      - -nginx.scrape-uri=http://nginx:80/nginx_status
    networks:
      - private
    depends_on:
      - nginx
    restart: always

  docker-exporter:
    mem_limit: 64m
    container_name: docker-exporter
    build: ./monitoring/metrics-exporters/docker-exporter/
    expose:
    - "8090"
    environment:
      DOCKER_API_URL: http://docker-socket-proxy:2375
    depends_on:
      - docker-socket-proxy
    networks:
    - private
    - docker-metrics
    healthcheck:
      test: ["CMD", "curl", "-f", "http://docker-exporter:8090/metrics.prom"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: always

  docker-socket-proxy:
    mem_limit: 64m
    image: tecnativa/docker-socket-proxy:latest
    environment:
      CONTAINERS: 1
      POST: 0
      EVENTS: 0
      PING: 0
      VERSION: 0
    volumes:
      - ${DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock:ro
    networks:
      - docker-metrics
    restart: always


  # ============================================================
  # BACKUP & RECOVERY
  # ============================================================

  backup-service:
    mem_limit: 512m
    build: ./databases/backup-recovery/backup-service
    container_name: backup-service
    volumes:
      - ./backups:/backups
    environment:
      IDENTITY_POSTGRES_HOST: ${IDENTITY_POSTGRES_HOST}
      IDENTITY_POSTGRES_PORT: ${IDENTITY_POSTGRES_PORT}
      IDENTITY_POSTGRES_USER: ${IDENTITY_POSTGRES_USER}
      IDENTITY_POSTGRES_PASSWORD: ${IDENTITY_POSTGRES_PASSWORD}
      IDENTITY_POSTGRES_DB: ${IDENTITY_POSTGRES_DB}
      ORG_POSTGRES_HOST: ${ORG_POSTGRES_HOST}
      ORG_POSTGRES_PORT: ${ORG_POSTGRES_PORT}
      ORG_POSTGRES_USER: ${ORG_POSTGRES_USER}
      ORG_POSTGRES_PASSWORD: ${ORG_POSTGRES_PASSWORD}
      ORG_POSTGRES_DB: ${ORG_POSTGRES_DB}
      CHAT_MONGO_USER: ${CHAT_MONGO_USER}
      CHAT_MONGO_PASSWORD: ${CHAT_MONGO_PASSWORD}
      CHAT_MONGO_AUTH_DB: ${CHAT_MONGO_AUTH_DB}
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    networks:
      - private
    depends_on:
      identity-service_postgres:
        condition: service_healthy
      org-service_postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    restart: always


# ============================================================
# PERSISTENT VOLUMES
# ============================================================

volumes:
  nginx_tls:
  database:
    # Identity storage: keep the existing volume and its Compose label.
    name: "database"
  org-service_postgres_data:
    name: "org-service_postgres_data"
  prometheus_data:
    name: "prometheus_data"
  grafana_data:
    name: "grafana_data"
  identity_avatars:
    name: "identity_avatars"
  mongo_data:
    name: "mongo_data"


# ============================================================
# NETWORKS
# ============================================================

networks:
  docker-metrics:
    name: docker-metrics
  private:
    name: private
