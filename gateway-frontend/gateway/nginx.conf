load_module modules/ngx_http_modsecurity_module.so;

pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    modsecurity on;
    modsecurity_rules_file /etc/modsecurity.d/setup.conf;

    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
    limit_req_status 429;

    upstream identity-service { server identity-service:8083; }
    upstream org-service      { server org-service:8082; }
    upstream chat-service     { server chat-service:8081; }
    upstream docker-exporter  { server docker-exporter:8090; }
    upstream grafana          { server grafana:3000; }
    upstream prometheus       { server prometheus:9090; }
    upstream status-page      { server status-page:8080; }
    upstream frontend         { server frontend:80; }

    server {
        listen 8080;
        listen [::]:8080;
        server_name ${DOMAIN} www.${DOMAIN} _;

        location /nginx_status {
            stub_status on;
            allow 127.0.0.1;
            allow 172.16.0.0/12;
            allow 10.0.0.0/8;
            allow 192.168.0.0/16;
            deny all;
        }

        location / {
            return 301 https://$host:8443$request_uri;
        }
    }

    server {
        listen 8443 ssl;
        listen [::]:8443 ssl;
        server_name ${DOMAIN} www.${DOMAIN} _;

        ssl_certificate     /etc/nginx/conf/server.crt;
        ssl_certificate_key /etc/nginx/conf/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        client_max_body_size 10m;
        ssl_ciphers HIGH:!aNULL:!MD5;

        root /usr/share/nginx/html;
        index index.html;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        location /nginx_status {
            stub_status on;
            allow 127.0.0.1;
            allow 172.16.0.0/12;
            allow 10.0.0.0/8;
            allow 192.168.0.0/16;
            deny all;
        }

        location /avatars/ {
            proxy_pass http://identity-service;
        }

        location /api/users/ {
            limit_req zone=api_limit burst=30 nodelay;
            rewrite ^/api/users/(.*)$ /$1 break;
            proxy_pass http://identity-service;
        }

        location /api/auth/ {
            limit_req zone=api_limit burst=30 nodelay;
            rewrite ^/api/auth/(.*)$ /$1 break;
            proxy_pass http://identity-service;
        }

        location /api/orgs/ {
            limit_req zone=api_limit burst=30 nodelay;
            rewrite ^/api/orgs/(.*)$ /$1 break;
            proxy_pass http://org-service;
        }

        location /ws/chat {
            proxy_pass http://chat-service;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
        }

        location = /api/rooms {
            limit_req zone=api_limit burst=30 nodelay;
            proxy_pass http://chat-service;
        }

        location /api/rooms/ {
            limit_req zone=api_limit burst=30 nodelay;
            proxy_pass http://chat-service;
        }

        location /api/chat/ {
            limit_req zone=api_limit burst=30 nodelay;
            rewrite ^/api/chat/(.*)$ /$1 break;
            proxy_pass http://chat-service;
        }

        location /metrics.prom {
            modsecurity off;
            allow 127.0.0.1;
            allow 172.16.0.0/12;
            allow 10.0.0.0/8;
            allow 192.168.0.0/16;
            deny all;
            proxy_pass http://docker-exporter/metrics.prom;
        }

        location /prometheus/ {
            modsecurity off;
            allow 127.0.0.1;
            allow 172.16.0.0/12;
            allow 10.0.0.0/8;
            allow 192.168.0.0/16;
            deny all;
            rewrite ^/prometheus/(.*)$ /$1 break;
            proxy_pass http://prometheus;
        }

        location /grafana/ {
            modsecurity off;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            rewrite ^/grafana/(.*)$ /$1 break;
            proxy_pass http://grafana;
        }

        location = /status {
            return 302 https://status.${DOMAIN}:8443/;
        }

        location /status/ {
            return 302 https://status.${DOMAIN}:8443/;
        }

        location / {
            proxy_pass http://frontend;
        }
    }

    # Gatus requires its own host; all of its assets and API routes stay here.
    server {
        listen 8443 ssl;
        listen [::]:8443 ssl;
        server_name status.${DOMAIN} status.localhost;

        ssl_certificate     /etc/nginx/conf/server.crt;
        ssl_certificate_key /etc/nginx/conf/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        modsecurity off;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        location / {
            proxy_pass http://status-page;
        }
    }

}
